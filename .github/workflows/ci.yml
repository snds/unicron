name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:build
      - run: pnpm typecheck
      - run: pnpm lint
      # Token lint: tiers 2/3 alias lower tiers; no colour literals in packages/ui/src.
      - run: pnpm lint:tokens
      - run: pnpm build
      - run: pnpm test
      # Design-system analytics ratchet: fails when correct-use violations grow
      # beyond .dsa/baseline.json (sense and gate with the same code).
      - run: pnpm ds:ratchet
      # Every package still packs (files whitelist, exports, workspace:* rewrite) before a release
      # depends on it. Private packages (root, playground) are listed too; only @unicron/* ship.
      - run: pnpm -r pack --dry-run
