name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # --no-frozen-lockfile until snds/dsa has a main branch and the lockfile carries @snds/dsa;
      # then switch back to --frozen-lockfile.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm tokens:build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      # Design-system analytics ratchet: fails when correct-use violations grow.
      # Allowed to fail until `pnpm ds:ratchet --init` has written .dsa/baseline.json.
      - run: pnpm ds:ratchet
        continue-on-error: true
